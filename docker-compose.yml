version: '3.8'

services:
  web:
    build: ./web
    container_name: kalshi_app
    restart: always
    environment:
      - SECRET_KEY=change_this_to_random_string_production
      - ENCRYPTION_KEY=BivCVHeSDq9rBw3agMgdImjGSzHrb2Yr2aVdqZJRbkE=
    volumes:
      - ./web:/app
  
  nginx:
    image: nginx:alpine
    container_name: kalshi_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
