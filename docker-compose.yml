services:
  web:
    build: ./web
    container_name: kalshi_app
    restart: unless-stopped
    env_file: .env
    environment:
      - BOT_DB_PATH=/app/data/bot_data.db
    volumes:
      # Only the database is persisted. The source is baked into the image,
      # so a compromise of the volume cannot rewrite application code.
      - kalshi_data:/app/data
    expose:
      - "5000"
    # No ports mapping: the app is only reachable through the proxy.
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    container_name: kalshi_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  kalshi_data:
  caddy_data:
  caddy_config:
