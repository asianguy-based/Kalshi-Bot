<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>WANAX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Space+Grotesk:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='wanax.css') }}">
    <style>
        :root { --primary: #E8E4DC; --bg: #0D0D0D; }
        * { box-sizing: border-box; }
        body { background: var(--wx-black); color: var(--wx-bone); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: var(--wx-font-body); overflow: hidden; }
        .card { width: 340px; text-align: center; position: relative; z-index: 10; }
        h1 { font-size: 2rem; margin: 1.5rem 0 0; }
        .brand { display: flex; flex-direction: column; align-items: center; margin-bottom: 3rem; }
        input { margin-bottom: 24px; }
        button { width: 100%; }
        #msg { min-height: 1.2em; margin-top: 18px; font-size: .75rem; color: var(--wx-rust); letter-spacing: .12em; font-family: var(--wx-font-head); text-transform: uppercase; }
        /* Bronze glow, not white: the palette forbids "tech" colours. */
        #cursor-glow { position: fixed; width: 400px; height: 400px; background: radial-gradient(circle, var(--wx-bronze-dim), transparent 60%); pointer-events: none; transform: translate(-50%, -50%); transition: .1s; }
    </style>
</head>
<body>
    <div id="cursor-glow"></div>
    <div class="card">
        <div class="brand">
            <div class="wx-glyph" style="--g:1.1">
                <div class="wx-glyph__node"></div>
                <div class="wx-glyph__stem"></div>
                <div class="wx-glyph__record"></div>
            </div>
            <h1 class="wx-wordmark">Wanax</h1>
            <p class="wx-tagline">Above All Orders</p>
        </div>
        <form id="loginForm" autocomplete="off">
            <input type="password" id="passphrase" class="wx-input" placeholder="KEY" required autofocus
                   autocomplete="current-password" maxlength="256">
            <button type="submit" id="btn" class="wx-btn">Enter</button>
        </form>
        <div id="msg"></div>
    </div>
    <script>
        document.addEventListener('mousemove', e => {
            const g = document.getElementById('cursor-glow');
            g.style.left = e.clientX + 'px';
            g.style.top = e.clientY + 'px';
        });

        const form = document.getElementById('loginForm');
        const btn = document.getElementById('btn');
        const msg = document.getElementById('msg');

        form.addEventListener('submit', async e => {
            e.preventDefault();
            const input = document.getElementById('passphrase');
            msg.textContent = '';
            btn.disabled = true;
            btn.textContent = 'Authenticating';
            try {
                const res = await fetch('/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ passphrase: input.value })
                });
                const data = await res.json().catch(() => ({}));
                if (res.ok && data.status === 'success') {
                    window.location.href = data.redirect || '/dashboard';
                    return;
                }
                msg.textContent = res.status === 429
                    ? (data.message || 'TOO MANY ATTEMPTS. WAIT.')
                    : 'ACCESS DENIED';
            } catch (err) {
                msg.textContent = 'CONNECTION ERROR';
            }
            input.value = '';
            input.focus();
            btn.disabled = false;
            btn.textContent = 'Enter';
        });
    </script>
</body>
</html>
